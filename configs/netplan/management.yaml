network:
  version: 2
  renderer: networkd
  ethernets:

    #-----------------------#
    #       MANAGEMENT      #
    #-----------------------#

    # MANAGEMENT PLANE
    # vmbr99
    ens18:
      addresses:
        - 192.168.99.99/24

    # SERVICE PLANE 
    # vmbr88
    ens19:
      addresses:
        - 10.254.0.99/24
      routes:
        - to: default
          via: 10.254.0.1
      nameservers:
        addresses: [8.8.8.8, 1.1.1.1]
