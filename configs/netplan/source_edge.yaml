network:
  version: 2
  renderer: networkd
  ethernets:

    #-----------------------#
    #       SOURCE EDGE     #
    #-----------------------#

    # MANAGEMENT PLANE
    # vmbr99
    ens18:
      addresses:
        - 192.168.99.150/24

    # SERVICE PLANE
    # vmbr88
    ens19:
      addresses:
        - 10.254.0.150/24
      routes:
        - to: default
          via: 10.254.0.1
      nameservers:
        addresses: [8.8.8.8, 1.1.1.1]

    # DATA PLANE
    # vmbr5 
    # Source Edge - Transit 1    
    ens20:
      addresses: [10.0.40.150/24]

    # DATA PLANE
    # vmbr6
    # Source Edge - Transit 2
    ens21:
      addresses: [10.0.50.150/24]

    # DATA PLANE
    # vmbr7
    # Source Edge - Transit 3
    ens22:
      addresses: [10.0.60.150/24]

    # DATA PLANE
    # vmbr8
    # Source Edge - Source
    ens23:
      addresses: [10.0.2.150/24]
